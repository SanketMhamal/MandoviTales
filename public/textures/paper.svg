<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <!-- Cold-press paper: fine tooth plus faint, larger mottling. Tiles seamlessly. -->
  <filter id="p" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="4" stitchTiles="stitch" result="tooth"/>
    <feColorMatrix in="tooth" type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.36  0 0 0 0 0.28  0 0 0 -0.55 0.36" result="t"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="9" stitchTiles="stitch" result="mottle"/>
    <feColorMatrix in="mottle" type="matrix" values="0 0 0 0 0.62  0 0 0 0 0.5  0 0 0 0 0.36  0 0 0 -0.5 0.3" result="m"/>
    <feMerge><feMergeNode in="m"/><feMergeNode in="t"/></feMerge>
  </filter>
  <rect width="480" height="480" filter="url(#p)" opacity=".55"/>
</svg>
